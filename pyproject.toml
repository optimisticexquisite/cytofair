[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "cytofair"
version = "0.1.0"
description = "Leakage-aware provenance recovery and evaluation for cervical cytology benchmarks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "h5py>=3.11,<4",
  "numpy>=2.0,<3",
  "opencv-python-headless==5.0.0.93",
  "pandas>=2.2,<4",
  "pillow>=10.4,<13",
  "py7zr>=0.22,<2",
  "pyarrow==25.0.1",
  "scikit-learn==1.9.0",
  "scipy>=1.14,<2",
  "statsmodels>=0.14,<1",
]

[project.optional-dependencies]
train = [
  "segmentation-models-pytorch==0.5.0",
  "torch>=2.4,<3",
  "torchvision>=0.19,<1",
  "timm>=1.0,<2",
]
dev = ["pytest>=8.3,<10", "pytest-cov>=5,<8", "ruff>=0.6,<1"]

[project.scripts]
cytofair = "cytofair.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cytofair"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
